# BarelyStorage settings. Energy is in Forge Energy (FE); rates are per game tick (20 per second).
# Edit a value and restart the game or server. Delete a line to restore its default.

# Energy (FE) a Server Rack can hold.
power.buffer=400000

# Most FE a Server Rack takes in per tick.
power.max_receive=4000

# FE per tick a powered rack always uses.
power.base_per_tick=8

# Extra FE per tick for each cartridge in a rack.
power.per_cartridge=2

# Extra FE per tick for each blade in a rack (a Quantum Core costs three times this).
power.per_blade=4

# Percent of a rack's upkeep each Efficiency card in the network takes off.
power.efficiency_percent=10

# Most upkeep, in percent, Efficiency cards can take off.
power.efficiency_max_percent=50

# Items an Iron Drive holds.
tier.iron.capacity=8192

# Items a Steel Drive holds.
tier.steel.capacity=65536

# Items a Gold Drive holds.
tier.gold.capacity=262144

# Items an Obsidian Drive holds.
tier.obsidian.capacity=4194304

# Items a Quantum Drive holds.
tier.quantum.capacity=134217728

# Different item types an Iron Drive holds.
tier.iron.types=16

# Different item types a Steel Drive holds.
tier.steel.types=32

# Different item types a Gold Drive holds.
tier.gold.types=64

# Different item types an Obsidian Drive holds.
tier.obsidian.types=128

# Different item types a Quantum Drive holds.
tier.quantum.types=512

# Drive bays in a Server Rack (4 to 8).
rack.drive_bays=8

# Blade slots in a Server Rack.
rack.blade_slots=4

# Threads one Basic Core adds.
hardware.basic_core.threads=1

# RAM units one Basic Core adds.
hardware.basic_core.ram=8

# Threads one Multi-Threaded RAM Blade adds.
hardware.ram_blade.threads=4

# RAM units one Multi-Threaded RAM Blade adds.
hardware.ram_blade.ram=32

# Threads one Quantum Core adds.
hardware.quantum_core.threads=8

# RAM units one Quantum Core adds.
hardware.quantum_core.ram=128

# Deepest chain of patterns a rack with a RAM Blade but no Quantum Core can plan.
hardware.ram_blade.depth=3

# Deepest chain of patterns a rack with only Basic Cores can plan.
hardware.basic.depth=1

# Ticks an Assembler needs for one run of a crafting pattern.
crafting.assembler_ticks_per_run=10

# Most runs of a pattern started at once.
crafting.max_batch=16

# Most crafting jobs a network queues.
crafting.job_limit=16

# Ticks between item moves of an Interface Node, Import Node or Storage Bus.
nodes.interval_ticks=8

# Most items an Interface or Import Node moves per step.
nodes.items_per_move=32
