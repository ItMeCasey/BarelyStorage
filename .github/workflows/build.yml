name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  versions:
    # Every module must carry the same mod_version (releases are tagged v<mod_version>).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: All modules agree on mod_version
        run: |
          versions=$(grep -h '^mod_version=' */gradle.properties | sort -u)
          echo "$versions"
          test "$(echo "$versions" | wc -l)" -eq 1

  test:
    # Unit tests for the shared logic that does not need a running game.
    needs: versions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoforge-26.2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
        env:
          IMC_MAVEN_USER: ${{ secrets.IMC_MAVEN_USER }}
          IMC_MAVEN_PASSWORD: ${{ secrets.IMC_MAVEN_PASSWORD }}

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        layer: [neoforge-26.1.2, forge-26.1.2, neoforge-26.2, forge-26.2, neoforge-26.3, forge-26.3]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.layer }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
        env:
          IMC_MAVEN_USER: ${{ secrets.IMC_MAVEN_USER }}
          IMC_MAVEN_PASSWORD: ${{ secrets.IMC_MAVEN_PASSWORD }}
      - uses: actions/upload-artifact@v5
        with:
          name: barelystorage-${{ matrix.layer }}
          path: |
            ${{ matrix.layer }}/build/libs/*.jar
            !${{ matrix.layer }}/build/libs/*-sources.jar
            !${{ matrix.layer }}/build/libs/*-dev.jar

  combine:
    # One combined jar per Minecraft version, holding both loaders.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: layers
      - name: Combine the loader jars of each Minecraft version
        run: |
          mkdir -p dist
          for mc in 26.1.2 26.2 26.3; do
            version=$(grep -h '^mod_version=' forge-$mc/gradle.properties | cut -d= -f2)
            python3 scripts/combine_jars.py "dist/barelystorage-mc$mc-$version.jar" layers/barelystorage-*-$mc/*.jar
          done
          ls -la dist
      - name: The release jars hold no development tools
        run: |
          for jar in dist/*.jar; do
            if unzip -l "$jar" | grep -E "/dev/|SelfTest|ShotTour"; then echo "dev files in $jar"; exit 1; fi
          done
      - uses: actions/upload-artifact@v5
        with:
          name: combined-jars
          path: dist/*.jar
