plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

base.archivesName = "${mod_id}-forge-mc${minecraft_version}"
version = mod_version
group = mod_group

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

// Shared code lives in ../common and is compiled into this loader layer and the combined jar.
sourceSets {
    test {
        java.srcDir '../common/src/test/java'
    }
    main {
        java.srcDir '../version-26.3/src/main/java'
        java.srcDir '../common/src/main/java'
        resources.srcDir '../version-26.3/src/main/resources'
        resources.srcDir '../common/src/main/resources'
    }
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            if (project.hasProperty('devTools')) { systemProperty 'barelystorage.dev', 'true' }
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

// Fills in mods.toml from gradle.properties, the same way the other layers fill in their metadata.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, forge_version: forge_version,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// Unit tests for the shared logic (food math, comparator ranking); they need no running game.
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// SMWTI (Show Me What This Is) is an optional look-at overlay of ours. Only its API is compiled against, from the jar in
// ../libs (the com.itmecasey.smwti.api classes of SMWTI's own jar); the plugin class is never loaded unless SMWTI is installed.
dependencies {
    compileOnly files('../libs/smwti-api-26.3.jar')
}

// Development tools (generator self test, test energy sink, screenshot tour) live in src/dev folders and only build with
// -PdevTools, so a normal build and the release jars never contain them.
if (project.hasProperty('devTools')) {
    sourceSets.main.java.srcDir '../version-26.3/src/dev/java'
    sourceSets.main.java.srcDir 'src/dev/java'
    sourceSets.main.resources.srcDir '../version-26.3/src/dev/resources'
}

// --- Optional integrations (generated by scripts/add_jade.py) ---
// Dev and compile-only access to the optional mods. Nothing here ships: the release jars only hold our own classes, and each
// integration loads only when the other mod is installed. -Pviewers=jade,jei,rei,emi,bei adds those mods to the dev client.
repositories {
    def imcUser = System.getenv('IMC_MAVEN_USER') ?: project.findProperty('imcMavenUser')
    def imcPass = System.getenv('IMC_MAVEN_PASSWORD') ?: project.findProperty('imcMavenPassword')
    if (imcUser && imcPass) {
        maven {
            name = 'ItMeCasey mirror'
            url = 'https://itmecasey.com/maven'
            credentials { username = imcUser; password = imcPass }
            content { includeGroup 'curse.maven' }
        }
    }
    maven {
        name = 'Cursemaven (fallback)'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

def viewerFiles = [bei: 'bei-1783910:9451187']
if (project.hasProperty('viewers')) {
    dependencies {
        project.property('viewers').split(',').each { name -> runtimeOnly "curse.maven:${viewerFiles[name.trim()]}" }
    }
}
